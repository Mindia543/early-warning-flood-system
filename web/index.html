<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="early_warning_flood_system">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>early_warning_flood_system</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot-status" style="font-family:Arial,sans-serif;color:#0b2232;text-align:center;padding:32px">
    Loading FloodWatch…
  </div>
  <script>
    // Unregister older Flutter workers without blocking the current app boot.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      }).catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      }).catch(function () {});
    }

    window.addEventListener('error', function (event) {
      var status = document.getElementById('boot-status');
      if (status && event.error) {
        status.innerHTML = 'FloodWatch could not start. Please reload this page.';
        status.style.color = '#b42318';
        console.error(event.error);
      }
    });

    try {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?build=mobile-risk-20261012';
      script.async = true;
      script.onerror = function () {
        var status = document.getElementById('boot-status');
        if (status) {
          status.innerHTML = 'FloodWatch could not load its web bundle. Please reload this page.';
          status.style.color = '#b42318';
        }
      };
      document.body.appendChild(script);
    } catch (error) {
      console.error(error);
    }
  </script>
</body>
</html>
